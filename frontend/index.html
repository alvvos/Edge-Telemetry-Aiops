<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIOps Telemetry Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans antialiased p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Cabecera -->
        <header class="flex items-center justify-between mb-8 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-emerald-400">AIOps Telemetry</h1>
                <p class="text-sm text-gray-400">Monitorización de hardware en tiempo real</p>
            </div>
            <div class="flex items-center gap-2">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="text-sm font-medium text-emerald-500">Live</span>
            </div>
        </header>

        <!-- Tarjetas de métricas (KPIs) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg">
                <h3 class="text-gray-400 text-sm font-medium mb-1">Carga de CPU</h3>
                <p id="cpu-value" class="text-3xl font-bold text-white">-- %</p>
            </div>
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg">
                <h3 class="text-gray-400 text-sm font-medium mb-1">Uso de RAM</h3>
                <p id="ram-value" class="text-3xl font-bold text-white">-- %</p>
            </div>
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg">
                <h3 class="text-gray-400 text-sm font-medium mb-1">Temperatura GPU</h3>
                <p id="gpu-value" class="text-3xl font-bold text-white">-- °C</p>
            </div>
        </div>

        <!-- Contenedor del gráfico -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg">
            <div id="metrics-chart" class="w-full h-96"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
